server {
  listen 80;

  # SSE stream — must come BEFORE the generic /api/ block so it wins.
  # Buffering / caching MUST be off or events get held until the buffer
  # fills (30s+ delay before the client sees the first event).
  location ~ ^/api/rooms/[^/]+/events$ {
    proxy_pass http://api-gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Player-Token $http_x_player_token;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }

  # API → FastAPI orchestrator
  location /api/ {
    proxy_pass http://api-gateway:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Player-Token $http_x_player_token;
  }

  # Everything else → Next.js (SSR)
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
